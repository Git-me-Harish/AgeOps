# configs/kubernetes/agents/agents-deployment.yaml
# Apply: kubectl apply -f configs/kubernetes/agents/ -n mlops

---
# Namespace 
apiVersion: v1
kind: Namespace
metadata:
  name: mlops

---
# Orchestrator Agent 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-agent
  namespace: mlops
  labels:
    app: orchestrator-agent
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-agent
  template:
    metadata:
      labels:
        app: orchestrator-agent
    spec:
      serviceAccountName: orchestrator-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: orchestrator
          image: your-dockerhub-user/mlops-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-tracking.mlflow.svc.cluster.local:5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neon-credentials
                  key: connection-string
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: access-key
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: secret-key
            - name: R2_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: endpoint-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: openai-api-key
            - name: APP_ENV
              value: "production"
            - name: K8S_IN_CLUSTER
              value: "true"
            - name: CORS_ALLOWED_ORIGINS
              value: '["https://mlops.yourdomain.com"]'   # ← replace with the real ingress host
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.mlops.svc.cluster.local:4317"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
        # OPA sidecar — GovernanceAgent.check_policy() calls 127.0.0.1:8181
        # in-process (ADR-002: no network hop, fail-closed in production if
        # this container is unhealthy). This was designed in
        # agents/governance_agent.py's module docstring from Phase 2 but the
        # sidecar itself was never actually added to this manifest — without
        # it, GovernanceAgent always hits connection-refused and, correctly,
        # always fails closed, but the policy engine never actually
        # evaluates anything in a real deployment.
        - name: opa
          image: openpolicyagent/opa:latest
          args:
            - "run"
            - "--server"
            - "--addr=127.0.0.1:8181"
            # --watch: the mounted ConfigMap volume is updated in place by
            # kubelet (~60s sync) when the Phase 6 policy editor patches
            # mlops-opa-policy — without --watch, OPA only loads the file
            # once at container start and a saved edit would silently never
            # take effect until the next pod restart.
            - "--watch"
            - "/policies/mlops_policy.rego"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: opa-policy
              mountPath: /policies
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: opa-policy
          # Create with:
          #   kubectl create configmap mlops-opa-policy \
          #     --from-file=mlops_policy.rego=configs/opa_policies/mlops_policy.rego \
          #     -n mlops
          # (documented in configs/opa_policies/mlops_policy.rego's header —
          # kept as an imperative step, not duplicated inline here, so the
          # ConfigMap can never silently drift from the source .rego file.)
          configMap:
            name: mlops-opa-policy

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-agent
  namespace: mlops
spec:
  selector:
    app: orchestrator-agent
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
# MLflow MCP Server 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-mcp-server
  namespace: mlops
  labels:
    app: mlflow-mcp-server
    tier: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlflow-mcp-server
  template:
    metadata:
      labels:
        app: mlflow-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mcp-server
          image: your-dockerhub-user/mlops-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-tracking.mlflow.svc.cluster.local:5000"

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-mcp-server
  namespace: mlops
spec:
  selector:
    app: mlflow-mcp-server
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP

---
# Registry Server — mcp_servers/registry_server.py (port 8002). Existed as
# code since the Phase 3/4 pass but was never actually deployed: no
# Deployment/Service backed it, so /registry/v1/* has never been reachable
# in a real cluster. Reuses the mlops-orchestrator image (already contains
# agents/, mcp_servers/, configs/) with a different uvicorn target, the same
# pattern already used by monitor-loop / process-retraining-triggers below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-server
  namespace: mlops
  labels:
    app: registry-server
    tier: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registry-server
  template:
    metadata:
      labels:
        app: registry-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: registry-server
          image: your-dockerhub-user/mlops-orchestrator:latest
          imagePullPolicy: Always
          command: ["uvicorn", "mcp_servers.registry_server:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "2"]
          ports:
            - containerPort: 8002
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-tracking.mlflow.svc.cluster.local:5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neon-credentials
                  key: connection-string
            - name: APP_ENV
              value: "production"
            - name: CORS_ALLOWED_ORIGINS
              value: '["https://mlops.yourdomain.com"]'   # ← replace with the real ingress host
          livenessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: registry-server
  namespace: mlops
spec:
  selector:
    app: registry-server
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP

---
