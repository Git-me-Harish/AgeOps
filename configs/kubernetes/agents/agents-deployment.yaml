---
# RL Optimizer CronJob — weekly (plan §5.4: "retrained weekly — needs
# sufficient new data", not daily; also fixed the entrypoint to actually
# match the enriched training path in scripts/train_rl_weekly.py)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rl-optimizer
  namespace: mlops
spec:
  schedule: "0 3 * * 0"   # 3 AM UTC every Sunday
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: rl-optimizer
              image: your-dockerhub-user/mlops-rl-agent:latest
              imagePullPolicy: Always
              command: ["python", "scripts/train_rl_weekly.py"]
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "2Gi"
                  cpu: "1000m"
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow-tracking.mlflow.svc.cluster.local:5000"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: neon-credentials
                      key: connection-string
                - name: RL_TRAINING_TIMESTEPS
                  value: "10000"

---
# Retraining Trigger Processor CronJob (Phase 5 §5.3 closed loop) — polls
# workflow_triggers for rows MonitoringAgent wrote on a CRITICAL breach and
# launches a real workflow for each via
# OrchestratorAgent.process_pending_triggers().
apiVersion: batch/v1
kind: CronJob
metadata:
  name: process-retraining-triggers
  namespace: mlops
spec:
  schedule: "*/5 * * * *"   # every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: process-triggers
              image: your-dockerhub-user/mlops-orchestrator:latest
              command: ["python", "scripts/process_triggers.py"]
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow-tracking.mlflow.svc.cluster.local:5000"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: neon-credentials
                      key: connection-string
                - name: APP_ENV
                  value: "production"
                - name: K8S_IN_CLUSTER
                  value: "true"

---
# Production Monitoring Loop (Phase 5 §5.2) — long-running, not a CronJob:
# ticks MonitoringAgent every settings.monitoring_interval_seconds for every
# model currently in the MLflow Registry's Production stage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-loop
  namespace: mlops
  labels:
    app: monitor-loop
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-loop
  template:
    metadata:
      labels:
        app: monitor-loop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: monitor-loop
          image: your-dockerhub-user/mlops-orchestrator:latest
          command: ["python", "scripts/monitor_loop.py"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-tracking.mlflow.svc.cluster.local:5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neon-credentials
                  key: connection-string
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: access-key
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: secret-key
            - name: R2_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: r2-credentials
                  key: endpoint-url
            - name: APP_ENV
              value: "production"

---
# Budget Monitor CronJob 
apiVersion: batch/v1
kind: CronJob
metadata:
  name: budget-monitor
  namespace: mlops
spec:
  schedule: "0 0 * * *"   # midnight UTC daily
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: budget-monitor
              image: your-dockerhub-user/mlops-orchestrator:latest
              command: ["python", "scripts/budget_monitor.py"]
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
              env:
                - name: CLOUDFLARE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-secrets
                      key: api-token
                - name: CLOUDFLARE_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-secrets
                      key: account-id
                - name: NEON_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: neon-secrets
                      key: api-key
                - name: NEON_PROJECT_ID
                  valueFrom:
                    secretKeyRef:
                      name: neon-secrets
                      key: project-id
