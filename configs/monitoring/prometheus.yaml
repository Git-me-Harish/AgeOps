# configs/monitoring/prometheus.yaml
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  - job_name: orchestrator-api
    static_configs:
      - targets: ["orchestrator:8000"]
    metrics_path: /metrics

  - job_name: mlflow-mcp-server
    static_configs:
      - targets: ["mcp-server:8001"]
    metrics_path: /metrics

  - job_name: mlflow-tracking
    static_configs:
      - targets: ["mlflow:5000"]
    metrics_path: /metrics

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
